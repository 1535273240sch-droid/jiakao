name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android@v3：它是 Node 20 的 action，在 runner 上被
      # 强制跑在 Node 24 上，接受 license 的中途就失败退出（日志里无 ##[error]，
      # 只有 "Node.js 20 is deprecated ... forced to run on Node.js 24" 警告）。
      # ubuntu runner 镜像本来就预装 Android SDK 并预接受了 license，这里只用镜像自带的
      # sdkmanager 补齐本项目钉住的版本（core/data 显式 buildToolsVersion = 34.0.0）。
      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$CMDLINE" --licenses >/dev/null 2>&1 || true
          "$CMDLINE" "platforms;android-35" "build-tools;34.0.0" || true
          echo "ANDROID_HOME=$SDK"
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 01/03/04 的单测与 :app 的 JVM 单测共 204 个用例
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jiakao-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # release 变体（R8 full mode + 资源收缩）。未配置 keystore 时产出 unsigned APK，
      # 失败不阻断上面的 debug 产物。
      - name: Assemble release APK (unsigned)
        continue-on-error: true
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        if: hashFiles('app/build/outputs/apk/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jiakao-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/testDebugUnitTest/'
          if-no-files-found: ignore
